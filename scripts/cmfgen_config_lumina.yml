#  LUMINA-SN extended CMFGEN config
#  Based on shipped carsus/data/cmfgen_config.yml, with iron-peak coverage
#  for SN Ia UV blanketing: adds Cr II/III, Mn II/III, Sc II that are missing
#  from the default config, plus 19apr23 upgrades for Co II/III where
#  the level count has grown materially.
#
#  Ion-charge convention: 0 = neutral (I), 1 = singly-ionized (II), etc.

version: 2024.lumina.1

atom:
  H:
    ion_charge:
      0:
        date: 5dec96
        osc: hi_osc.dat
        hyd: hyd_l_data.dat
        gbf: gbf_n_data.dat
        col: hicol.dat
        pho:
          - hiphot.dat

  He:
